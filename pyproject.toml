[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depcheck"
version = "0.3.0"
description = "A dependency health checker for Python projects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "jlaportebot" },
]
keywords = ["dependencies", "security", "vulnerabilities", "outdated", "health-check"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.4.2",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "packaging>=26.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
depcheck = "depcheck.cli:main"

[project.optional-dependencies]
dev = [
 "pytest>=9.1.1",
 "pytest-cov>=7.1.0",
 "ruff>=0.16.2",
 "pytest-asyncio>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "ty>=0.0.59",
    "pytest-asyncio>=1.4.0",
]
audit = ["pip-audit>=2.10.1"]

[project.urls]
Homepage = "https://github.com/jlaportebot/depcheck"
Repository = "https://github.com/jlaportebot/depcheck"
Issues = "https://github.com/jlaportebot/depcheck/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "asyncio: marks tests as asyncio",
]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["depcheck"]

[tool.ty.terminal]
error-on-warning = true