name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: ""

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate uv.lock
        run: uv lock

      - name: Build package
        run: uv build

      - name: Verify wheel contents
        run: unzip -l dist/*.whl | grep -E "py\.typed|entry_points|RECORD"

      - name: Verify console script entry point
        run: python -c "import zipfile, glob; wheel=glob.glob('dist/*.whl')[0]; z=zipfile.ZipFile(wheel); ep=[n for n in z.namelist() if n.endswith('entry_points.txt')][0]; print(z.read(ep).decode())"

      - name: Smoke test installed wheel
        run: |
          uv venv .tmp/smoke-venv
          .tmp/smoke-venv/bin/pip install dist/*.whl
          .tmp/smoke-venv/bin/depcheck --version
          .tmp/smoke-venv/bin/depcheck --help | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/depcheck-cli
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}